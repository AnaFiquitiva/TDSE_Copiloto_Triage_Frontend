server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El experimento completo (E1-E6) puede tardar: timeout amplio.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
    }

    location /cds-services {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
